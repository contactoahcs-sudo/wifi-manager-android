name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk WifiManager.apk

      - name: Read versionCode
        id: ver
        run: echo "code=$(grep versionCode app/build.gradle.kts | grep -o '[0-9]\+')" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiManager-apk
          path: WifiManager.apk
          if-no-files-found: error

      - name: Publish GitHub Release (para auto-actualización)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v${{ steps.ver.outputs.code }}"
          gh release delete "$VER" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VER" WifiManager.apk \
            --title "Wifi Manager $VER" \
            --notes "Build automático de Wifi Manager $VER (detección de fabricantes + auto-actualización)."

      - name: Publish APK to 'apk' branch
        run: |
          cp WifiManager.apk /tmp/WifiManager.apk
          cd "$RUNNER_TEMP"
          rm -rf pub && mkdir pub && cd pub
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b apk
          cp /tmp/WifiManager.apk ./WifiManager.apk
          echo "APK generado por GitHub Actions." > README.md
          git add -f WifiManager.apk README.md
          git commit -q -m "APK build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
